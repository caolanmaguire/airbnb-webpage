<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome, Guest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f7f1e6;
    --cream-2: #f2ead9;
    --ink: #2b2420;
    --brown: #7a5230;
    --rust: #a9622f;
    --gold: #c9a15a;
    --gold-dark: #b6884a;
    --line: #6b5b47;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
  }

  body{
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    font-family: 'Montserrat', sans-serif;
  }

  .phone{
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 28px 26px 34px;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .menu-icon{
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 30px;
    margin-bottom: 18px;
  }
  .menu-icon span{
    display: block;
    height: 4px;
    border-radius: 2px;
    background: var(--gold-dark);
  }

  .greeting{
    text-align: center;
    margin: 6px 0 2px;
  }

  .dear-guest{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 4px;
    font-size: 13px;
    color: var(--ink);
    margin: 0 0 4px;
  }

  .welcome-title{
    font-family: 'Alex Brush', cursive;
    font-size: 68px;
    color: var(--brown);
    margin: 0;
    line-height: 1.1;
  }

  .click-icons{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 3.5px;
    font-size: 13px;
    color: var(--ink);
    margin: 10px 0 26px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    row-gap: 26px;
    column-gap: 8px;
    flex: 1;
    align-content: center;
  }

  .item{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .icon-wrap{
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }

  .icon-wrap svg{
    width: 100%;
    height: 100%;
    stroke: var(--brown);
    fill: none;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .label{
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    letter-spacing: 0.8px;
    font-size: 10.5px;
    color: var(--ink);
    line-height: 1.35;
    text-transform: uppercase;
  }

  .faq-bubble{
    width: 48px;
    height: 34px;
    border: 1.4px solid var(--brown);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 1px;
    font-size: 13px;
    color: var(--brown);
    margin-bottom: 10px;
    position: relative;
  }
  .faq-bubble::after{
    content:"";
    position: absolute;
    bottom: -7px;
    left: 12px;
    width: 10px;
    height: 10px;
    border-left: 1.4px solid var(--brown);
    border-bottom: 1.4px solid var(--brown);
    background: linear-gradient(135deg, transparent 50%, var(--cream) 50%);
    transform: rotate(-45deg);
  }

  .contact-btn-wrap{
    position: absolute;
    left: 26px;
    right: 26px;
    bottom: 22px;
    display: flex;
    justify-content: center;
  }

  .contact-btn{
    width: 100%;
    max-width: 300px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 14px 0;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    letter-spacing: 2px;
    font-size: 12px;
    text-transform: uppercase;
    box-shadow: 0 6px 14px rgba(180,130,50,0.35);
    cursor: pointer;
  }

  .spacer{
    height: 70px;
  }

  /* ===== Full-screen pullup ===== */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(30, 22, 14, 0.42);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    z-index: 10;
  }
  .overlay.open{
    opacity: 1;
    pointer-events: auto;
  }

  .pullup{
    position: fixed;
    inset: 0;
    background: var(--cream);
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(.32,.72,.35,1);
    z-index: 11;
    display: flex;
    flex-direction: column;
  }
  .pullup.open{
    transform: translateY(0);
  }

  .pullup-header{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 24px 14px;
    flex-shrink: 0;
    border-bottom: 1px solid #e9dfc9;
  }

  .pullup-icon{
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }
  .pullup-icon svg{
    width: 100%;
    height: 100%;
    stroke: var(--brown);
    fill: none;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .pullup-title{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 1.5px;
    font-size: 21px;
    color: var(--ink);
    text-transform: uppercase;
    margin: 0;
  }

  .pullup-close{
    margin-left: auto;
    width: 30px;
    height: 30px;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--brown);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pullup-close svg{
    width: 20px;
    height: 20px;
    stroke: var(--brown);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
  }

  .pullup-body{
    font-family: 'Montserrat', sans-serif;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--line);
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding: 20px 24px 40px;
  }

  .pullup-body p{ margin: 0 0 12px; }
  .pullup-body ul{ margin: 0 0 12px; padding-left: 18px; }
  .pullup-body li{ margin-bottom: 6px; }
  .pullup-body a{ color: var(--brown); }

  .section-heading{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    margin: 18px 0 8px;
  }

  .signoff{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }

  /* Banner (Welcome) */
  .banner-img{
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 18px;
    display: block;
  }

  /* Maps button */
  .btn-maps{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: #fff !important;
    text-decoration: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    font-size: 11px;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(180,130,50,0.3);
    margin-top: 6px;
  }
  .btn-maps svg{
    width: 14px;
    height: 14px;
    stroke: #fff;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Info rows (Check-in/out, Wifi) */
  .info-card{
    background: #fff;
    border: 1px solid #e9dfc9;
    border-radius: 14px;
    padding: 4px 16px;
    margin-bottom: 16px;
  }
  .info-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #efe6d3;
  }
  .info-row:last-child{ border-bottom: none; }
  .info-label{
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    letter-spacing: 0.6px;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--brown);
  }
  .info-value{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }
  .info-value a{ color: var(--ink); }


  /* Place cards (Places / Restaurants / Shops / Excursions) */
  .place-card{
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    align-items: flex-start;
  }
  .place-img{
    width: 88px;
    height: 88px;
    object-fit: cover;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .place-info{ flex: 1; min-width: 0; }
  .place-name{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .place-desc{
    font-size: 12px;
    line-height: 1.55;
    color: var(--line);
    margin: 0 0 8px;
  }

  /* Business cards (Transport) */
  .biz-card{
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 1px solid #e9dfc9;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .biz-img{
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .biz-name{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin: 0 0 2px;
  }
  .biz-detail a{ color: var(--brown); }
  .biz-detail{
    font-size: 12px;
    color: var(--line);
    margin: 0;
  }

</style>
</head>
<body>

<div class="phone">

  <div class="menu-icon">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <div class="greeting">
    <p class="dear-guest">D E A R &nbsp; G U E S T,</p>
    <h1 class="welcome-title">Welcome!</h1>
    <p class="click-icons">C L I C K &nbsp; O N &nbsp; T H E &nbsp; I C O N S</p>
  </div>

  <div class="grid">

    <div class="item" onclick="openPullup('welcome')">
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48"><path d="M8 24 L24 10 L40 24"/><path d="M12 21 V40 H36 V21"/><path d="M20 40 V29 H28 V40"/></svg>
      </div>
      <div class="label">Welcome</div>
    </div>

    <div class="item" onclick="openPullup('directions')">
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48"><path d="M24 6 C16 6 10 12 10 20 C10 30 24 44 24 44 C24 44 38 30 38 20 C38 12 32 6 24 6 Z"/><circle cx="24" cy="20" r="5.5"/></svg>
      </div>
      <div class="label">Driving<br>Directions</div>
    </div>

    <div class="item" onclick="openPullup('checkinout')">
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48"><circle cx="16" cy="24" r="8"/><path d="M22 24 H42 M34 24 V31 M40 24 V29"/></svg>
      </div>
      <div class="label">Check-In/Out</div>
    </div>



    <div class="item" onclick="openPullup('places')">
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48"><path d="M8 17 H16 L19 12 H29 L32 17 H40 V37 H8 Z"/><circle cx="24" cy="27" r="6.5"/></svg>
      </div>
      <div class="label">Places To<br>Visit</div>
    </div>

    <div class="item" onclick="openPullup('shops')">
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48"><path d="M10 20 H38 L34 40 H14 Z"/><path d="M17 20 C17 13 20 9 24 9 C28 9 31 13 31 20"/><path d="M14 26 H34 M15.5 33 H32.5"/></svg>
      </div>
      <div class="label">Supermarket<br>and Shops</div>
    </div>

    <div class="item" onclick="openPullup('restaurants')">
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48"><path d="M9 28 C9 20 15.5 15 24 15 C32.5 15 39 20 39 28 Z"/><path d="M7 28 H41"/><path d="M24 15 V9"/><path d="M20 9 H28"/><path d="M9 34 H39"/></svg>
      </div>
      <div class="label">Restaurants<br>and Cafes</div>
    </div>

    <div class="item" onclick="openPullup('excursions')">
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48"><path d="M8 30 H40 L35 40 H13 Z"/><path d="M24 30 V10 M24 12 L32 17 L24 20 Z"/><path d="M17 30 V16 H21 V30"/></svg>
      </div>
      <div class="label">Excursions and<br>Experiences</div>
    </div>

    <div class="item" onclick="openPullup('transport')">
      <div class="icon-wrap">
        <svg viewBox="0 0 48 48"><circle cx="13" cy="33" r="7"/><circle cx="35" cy="33" r="7"/><path d="M13 33 L20 18 H28 M20 18 L28 33 H13 M28 18 L35 33 M25 12 H31 M25 12 L28 18"/></svg>
      </div>
      <div class="label">Transport</div>
    </div>


  </div>

  <div class="spacer"></div>

  <div class="contact-btn-wrap">
    <button class="contact-btn" onclick="location.href='tel:+353858618755'">Contact</button>
  </div>

  <div class="overlay" id="overlay" onclick="closePullup()"></div>

  <div class="pullup" id="pullup">
    <div class="pullup-header">
      <div class="pullup-icon" id="pullup-icon"></div>
      <h2 class="pullup-title" id="pullup-title"></h2>
      <button class="pullup-close" onclick="closePullup()">
        <svg viewBox="0 0 24 24"><line x1="4" y1="4" x2="20" y2="20"/><line x1="20" y1="4" x2="4" y2="20"/></svg>
      </button>
    </div>
    <div class="pullup-body" id="pullup-body"></div>
  </div>

</div>

<script>
  const mapsIcon = `<svg viewBox="0 0 24 24"><path d="M12 2 C7.6 2 4 5.6 4 10 C4 16 12 22 12 22 C12 22 20 16 20 10 C20 5.6 16.4 2 12 2 Z"/><circle cx="12" cy="10" r="2.5"/></svg>`;

  function mapsBtn(query){
    const url = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(query);
    return `<a class="btn-maps" href="${url}" target="_blank" rel="noopener">${mapsIcon} View on Map</a>`;
  }

  // Photos load from the images/ folder until real ones are added
  function placeCard(img, name, desc, mapQuery, credit){
    return `<div class="place-card">
      ${img ? `<img class="place-img" src="${img}" alt="${name}">` : ''}
      <div class="place-info">
        <p class="place-name">${name}</p>
        <p class="place-desc">${desc}${credit ? `<br><small>Photo: ${credit}</small>` : ''}</p>
        ${mapsBtn(mapQuery)}
      </div>
    </div>`;
  }

  function bizCard(img, name, phone){
    const tel = phone.replace(/\s/g, '');
    return `<div class="biz-card">
      <img class="biz-img" src="${img}" alt="${name}">
      <div>
        <p class="biz-name">${name}</p>
        <p class="biz-detail"><a href="tel:${tel}">${phone}</a></p>
      </div>
    </div>`;
  }


  const content = {

    welcome: {
      title: "Welcome",
      icon: `<svg viewBox="0 0 48 48"><path d="M8 24 L24 10 L40 24"/><path d="M12 21 V40 H36 V21"/><path d="M20 40 V29 H28 V40"/></svg>`,
      body: `
        <img class="banner-img" src="https://picsum.photos/seed/welcomehouse/800/450" alt="Radharc na Cluana">
        <p>Hello and a very warm welcome to Radharc na Cluana. My name is Pauline and I’m delighted to share my home with you.</p>
        <p class="section-heading">About the house</p>
        <p>The house holds a very special place in my heart, as it was built by my father in the year 2000. It is more than just a house to me; it is part of my family’s history and a lasting reminder of his hard work, care and dedication.</p>
        <p>I’m very proud to welcome guests here and to share a place that means so much to me.</p>
        <p class="section-heading">About the host</p>
        <p>I wanted to create a place that feels warm, cozy and welcoming, where guests can relax, unwind and enjoy a little time away from the hustle and bustle of everyday life.</p>
        <p>I believe it’s the little things that make a stay special, and I hope you’ll find everything you need to feel right at home during your visit.</p>
        <p>Ballyconnell is surrounded by beautiful countryside, lakes and wonderful places to explore, whether you’re here for a wedding in the nearby Slieve Russell Hotel, a family getaway or simply a peaceful break.</p>
        <p>I hope you enjoy discovering all that the area has to offer.</p>
        <p>I want you to feel comfortable and at home while staying here, so if there’s anything you need or if I can help, please don’t hesitate to get in touch.</p>
        <p>Thank you for choosing Radharc na Cluana. It means a lot to me to welcome guests into my home &amp; I hope you leave with happy memories and the feeling that you’ve had a lovely little home away from home.</p>
        <p class="signoff">Wishing you a wonderful stay.<br>Warmest wishes,<br>Pauline</p>
      `
    },

    directions: {
      title: "Driving Directions",
      icon: `<svg viewBox="0 0 48 48"><path d="M24 6 C16 6 10 12 10 20 C10 30 24 44 24 44 C24 44 38 30 38 20 C38 12 32 6 24 6 Z"/><circle cx="24" cy="20" r="5.5"/></svg>`,
      body: `
        <a class="btn-maps" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent('Ballyconnell, Co. Cavan, Ireland')}" target="_blank" rel="noopener">${mapsIcon} Get Directions to Ballyconnell</a>
      `
    },

    checkinout: {
      title: "Check-In / Out",
      icon: `<svg viewBox="0 0 48 48"><circle cx="16" cy="24" r="8"/><path d="M22 24 H42 M34 24 V31 M40 24 V29"/></svg>`,
      body: `
        <div class="info-card">
          <div class="info-row"><span class="info-label">Check-in</span><span class="info-value">3:00 PM</span></div>
          <div class="info-row"><span class="info-label">Check-out</span><span class="info-value">11:00 AM</span></div>
          <div class="info-row"><span class="info-label">Host</span><span class="info-value">Pauline Maguire</span></div>
          <div class="info-row"><span class="info-label">Phone</span><span class="info-value"><a href="tel:+353858618755">+353 85 861 8755</a></span></div>
        </div>
        <p class="section-heading">House rules</p>
        <ul>
          <li>No pets</li>
          <li>No smoking</li>
          <li>No loud noise after 10pm</li>
          <li>Switch off heating before you leave</li>
        </ul>
      `
    },



    places: {
      title: "Places to Visit",
      icon: `<svg viewBox="0 0 48 48"><path d="M8 17 H16 L19 12 H29 L32 17 H40 V37 H8 Z"/><circle cx="24" cy="27" r="6.5"/></svg>`,
      body:
        placeCard("https://commons.wikimedia.org/wiki/Special:FilePath/Ballyconnell_bridge.jpg?width=300", "Woodford River Walk", "Riverside walking trail along the Woodford River in Ballyconnell.", "Woodford River Walk Ballyconnell", "Wikimedia Commons") +
        placeCard("https://www.irelandbeforeyoudie.com/wp-content/uploads/2020/10/cuilcagh-boardwalk-1024x1024.jpg", "Stairway to Heaven", "Boardwalk and staircase up Cuilcagh Mountain with wide views over Cavan and Fermanagh.", "Cuilcagh Boardwalk Stairway to Heaven") +
        placeCard("https://s3.geograph.org.uk/geophotos/07/02/52/7025267_dc4beda0_120x120.jpg", "Marble Arch Caves", "Show caves explored on foot and by boat in the Marble Arch Caves Global Geopark.", "Marble Arch Caves", "N Chadwick, CC BY-SA 2.0") +
        placeCard("https://s0.geograph.org.uk/geophotos/07/03/11/7031152_7d6070ac.jpg", "Cavan Burren Park", "Prehistoric landscape with ancient tombs, rock formations and walking trails.", "Cavan Burren Park", "N Chadwick, CC BY-SA 2.0") +
        placeCard("images/bear-essentials.jpg", "Bear Essentials Visitor Centre", "Visitor centre with a teddy bear collection and craft shop.", "Bear Essentials Visitor Centre Cavan") +
        placeCard("https://www.irelandbeforeyoudie.com/wp-content/uploads/2018/08/Killykeen-Forest-Park.jpg", "Killykeen Forest Park", "Forest park on Lough Oughter with woodland and lakeside trails.", "Killykeen Forest Park") +
        `<p>Before visiting these places, please check opening times &amp; weather conditions.</p>`
    },

    shops: {
      title: "Supermarket and Shops",
      icon: `<svg viewBox="0 0 48 48"><path d="M10 20 H38 L34 40 H14 Z"/><path d="M17 20 C17 13 20 9 24 9 C28 9 31 13 31 20"/><path d="M14 26 H34 M15.5 33 H32.5"/></svg>`,
      body:
        placeCard("images/supervalu.jpg", "SuperValu", "Supermarket in Ballyconnell.", "SuperValu Ballyconnell") +
        placeCard("images/kennedys.jpg", "Kennedys", "Local shop in Ballyconnell.", "Kennedys Ballyconnell")
    },

    restaurants: {
      title: "Restaurants and Cafes",
      icon: `<svg viewBox="0 0 48 48"><path d="M9 28 C9 20 15.5 15 24 15 C32.5 15 39 20 39 28 Z"/><path d="M7 28 H41"/><path d="M24 15 V9"/><path d="M20 9 H28"/><path d="M9 34 H39"/></svg>`,
      body:
        placeCard("images/daily-brew.jpg", "Daily Brew Coffee House", "Coffee house in Ballyconnell.", "Daily Brew Coffee House Ballyconnell") +
        placeCard("images/cafe-realta.jpg", "Cafe Realta", "Café in Ballyconnell.", "Cafe Realta Ballyconnell") +
        placeCard("images/aroma.jpg", "Aroma Coffee House", "Coffee house in Ballyconnell.", "Aroma Coffee House Ballyconnell") +
        placeCard("images/bridge-bar.jpg", "Bridge Bar Restaurant", "Bar and restaurant in Ballyconnell.", "Bridge Bar Restaurant Ballyconnell") +
        placeCard("images/anglers-rest.jpg", "Anglers Rest", "Restaurant in Ballyconnell.", "Anglers Rest Ballyconnell") +
        placeCard("images/bayleaf.jpg", "Bayleaf Restaurant", "Restaurant in Ballyconnell.", "Bayleaf Restaurant Ballyconnell")
    },

    excursions: {
      title: "Excursions and Experiences",

  const overlay = document.getElementById('overlay');
  const pullup = document.getElementById('pullup');

  function openPullup(key){
    const data = content[key];
    if(!data) return;
    document.getElementById('pullup-icon').innerHTML = data.icon;
    document.getElementById('pullup-title').textContent = data.title;
    document.getElementById('pullup-body').innerHTML = data.body;
    overlay.classList.add('open');
    pullup.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePullup(){
    overlay.classList.remove('open');
    pullup.classList.remove('open');
    document.body.style.overflow = '';
  }

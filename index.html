<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome, Guest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #f7f1e6;
    --cream-2: #f2ead9;
    --ink: #2b2420;
    --brown: #7a5230;
    --rust: #a9622f;
    --gold: #c9a15a;
    --gold-dark: #b6884a;
    --line: #6b5b47;
    --sage: #5b6e4e;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
  }

  body{
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--sage);
    font-family: 'Montserrat', sans-serif;
  }

  .phone{
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 28px 26px 34px;
    position: relative;
    display: flex;
    flex-direction: column;
  }

  .menu-icon{
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: 30px;
    margin-bottom: 18px;
  }
  .menu-icon span{
    display: block;
    height: 4px;
    border-radius: 2px;
    background: var(--gold-dark);
  }

  .greeting{
    text-align: center;
    margin: 6px 0 2px;
  }

  .logo{
    display: block;
    width: 100%;
    max-width: 260px;
    height: auto;
    margin: 0 auto 16px;
  }

  .dear-guest{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 4px;
    font-size: 13px;
    color: var(--cream);
    margin: 0 0 4px;
  }

  .welcome-title{
    font-family: 'Alex Brush', cursive;
    font-size: 68px;
    color: var(--cream);
    margin: 0;
    line-height: 1.1;
  }

  .click-icons{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 3.5px;
    font-size: 13px;
    color: var(--cream);
    margin: 10px 0 26px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    row-gap: 26px;
    column-gap: 8px;
    flex: 1;
    align-content: center;
  }

  .item{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    border: 1.4px solid rgba(247, 241, 230, 0.6);
    border-radius: 14px;
    padding: 14px 6px 12px;
    transition: background 0.15s ease;
  }
  .item:hover,
  .item:active{
    background: rgba(247, 241, 230, 0.12);
  }

  .icon-wrap{
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
  }

  .icon-wrap svg{
    width: 100%;
    height: 100%;
    stroke: var(--cream);
    fill: none;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .label{
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    letter-spacing: 0.8px;
    font-size: 10.5px;
    color: var(--cream);
    line-height: 1.35;
    text-transform: uppercase;
  }

  .faq-bubble{
    width: 48px;
    height: 34px;
    border: 1.4px solid var(--brown);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 1px;
    font-size: 13px;
    color: var(--brown);
    margin-bottom: 10px;
    position: relative;
  }
  .faq-bubble::after{
    content:"";
    position: absolute;
    bottom: -7px;
    left: 12px;
    width: 10px;
    height: 10px;
    border-left: 1.4px solid var(--brown);
    border-bottom: 1.4px solid var(--brown);
    background: linear-gradient(135deg, transparent 50%, var(--cream) 50%);
    transform: rotate(-45deg);
  }

  .contact-btn-wrap{
    position: absolute;
    left: 26px;
    right: 26px;
    bottom: 22px;
    display: flex;
    justify-content: center;
  }

  .contact-btn{
    width: 100%;
    max-width: 300px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: #fff;
    border: none;
    border-radius: 24px;
    padding: 14px 0;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    letter-spacing: 2px;
    font-size: 12px;
    text-transform: uppercase;
    box-shadow: 0 6px 14px rgba(180,130,50,0.35);
    cursor: pointer;
  }

  .spacer{
    height: 70px;
  }

  /* ===== Full-screen pullup ===== */
  .overlay{
    position: fixed;
    inset: 0;
    background: rgba(30, 22, 14, 0.42);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.28s ease;
    z-index: 10;
  }
  .overlay.open{
    opacity: 1;
    pointer-events: auto;
  }

  .pullup{
    position: fixed;
    inset: 0;
    background: var(--cream);
    transform: translateY(100%);
    transition: transform 0.32s cubic-bezier(.32,.72,.35,1);
    z-index: 11;
    display: flex;
    flex-direction: column;
  }
  .pullup.open{
    transform: translateY(0);
  }

  .pullup-header{
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 24px 14px;
    flex-shrink: 0;
    border-bottom: 1px solid #e9dfc9;
  }

  .pullup-icon{
    width: 32px;
    height: 32px;
    flex-shrink: 0;
  }
  .pullup-icon svg{
    width: 100%;
    height: 100%;
    stroke: var(--brown);
    fill: none;
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .pullup-title{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    letter-spacing: 1.5px;
    font-size: 21px;
    color: var(--ink);
    text-transform: uppercase;
    margin: 0;
  }

  .pullup-close{
    margin-left: auto;
    width: 30px;
    height: 30px;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--brown);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pullup-close svg{
    width: 20px;
    height: 20px;
    stroke: var(--brown);
    stroke-width: 1.8;
    fill: none;
    stroke-linecap: round;
  }

  .pullup-body{
    font-family: 'Montserrat', sans-serif;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--line);
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding: 20px 24px 40px;
  }

  .pullup-body p{ margin: 0 0 12px; }
  .pullup-body ul{ margin: 0 0 12px; padding-left: 18px; }
  .pullup-body li{ margin-bottom: 6px; }
  .pullup-body a{ color: var(--brown); }

  .section-heading{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--ink);
    margin: 18px 0 8px;
  }

  .signoff{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }

  /* Banner (Welcome) */
  .banner-img{
    width: 100%;
    height: 190px;
    object-fit: cover;
    border-radius: 16px;
    margin-bottom: 18px;
    display: block;
  }

  /* Maps button */
  .btn-maps{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(180deg, var(--gold) 0%, var(--gold-dark) 100%);
    color: #fff !important;
    text-decoration: none;
    border-radius: 20px;
    padding: 10px 18px;
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    letter-spacing: 1px;
    font-size: 11px;
    text-transform: uppercase;
    box-shadow: 0 4px 10px rgba(180,130,50,0.3);
    margin-top: 6px;
  }
  .btn-maps svg{
    width: 14px;
    height: 14px;
    stroke: #fff;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* Info rows (Check-in/out, Wifi) */
  .info-card{
    background: #fff;
    border: 1px solid #e9dfc9;
    border-radius: 14px;
    padding: 4px 16px;
    margin-bottom: 16px;
  }
  .info-row{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 13px 0;
    border-bottom: 1px solid #efe6d3;
  }
  .info-row:last-child{ border-bottom: none; }
  .info-label{
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    letter-spacing: 0.6px;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--brown);
  }
  .info-value{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
  }
  .info-value a{ color: var(--ink); }


  /* Place cards (Places / Restaurants / Shops / Excursions) */
  .place-card{
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
    align-items: flex-start;
  }
  .place-img{
    width: 88px;
    height: 88px;
    object-fit: cover;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .place-info{ flex: 1; min-width: 0; }
  .place-name{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 16px;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .place-desc{
    font-size: 12px;
    line-height: 1.55;
    color: var(--line);
    margin: 0 0 8px;
  }

  /* Business cards (Transport) */
  .biz-card{
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fff;
    border: 1px solid #e9dfc9;
    border-radius: 14px;
    padding: 12px;
    margin-bottom: 14px;
  }
  .biz-img{
    width: 60px;
    height: 60px;
    object-fit: cover;
    border-radius: 10px;
    flex-shrink: 0;
  }
  .biz-name{
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--ink);
    margin: 0 0 2px;
  }
  .biz-detail a{ color: var(--brown); }
  .biz-detail{
    font-size: 12px;
    color: var(--line);
    margin: 0;
  }

</style>
</head>

      body:

      body:

        placeCard("images/aroma.jpg", "Aroma Coffee House", "Coffee house in Ballyconnell.", "Aroma Coffee House Ballyconnell") +

        placeCard("images/anglers-rest.jpg", "Anglers Rest", "Restaurant in Ballyconnell.", "Anglers Rest Ballyconnell") +

    },

      title: "Hotels & Venues",

      body:
        placeCard("images/slieve-russell.jpg", "Slieve Russell Hotel Golf &amp; Country Club", "Hotel, golf and country club just outside Ballyconnell.", "Slieve Russell Hotel Golf & Country Club Ballyconnell") +
        placeCard("images/cavan-crystal.jpg", "Cavan Crystal Hotel", "Hotel in Cavan town.", "Cavan Crystal Hotel") +
        placeCard("images/kilmore-hotel.jpg", "Kilmore Hotel", "Hotel in Cavan town.", "Kilmore Hotel Cavan") +
        placeCard("images/farnham-estate.jpg", "Farnham Estate", "Spa and golf resort near Cavan town.", "Farnham Estate Spa and Golf Resort Cavan")
    },

    transport: {
      title: "Taxis",
      icon: `<svg viewBox="0 0 48 48"><circle cx="13" cy="33" r="7"/><circle cx="35" cy="33" r="7"/><path d="M13 33 L20 18 H28 M20 18 L28 33 H13 M28 18 L35 33 M25 12 H31 M25 12 L28 18"/></svg>`,
      body:
        bizCard("Vincent McGovern, Glan", "+353 87 232 1698") +
        bizCard("Martin Coaches", "+353 49 952 6222") +
        bizCard("Bob Leonard", "+353 87 777 6077") +
        bizCard("Connolly Cabs", "+353 87 795 6679")
    }
  };

  const overlay = document.getElementById('overlay');
  const pullup = document.getElementById('pullup');

  function openPullup(key){
    const data = content[key];
    if(!data) return;
    document.getElementById('pullup-icon').innerHTML = data.icon;
    document.getElementById('pullup-title').textContent = data.title;
    document.getElementById('pullup-body').innerHTML = data.body;
    overlay.classList.add('open');
    pullup.classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closePullup(){
    overlay.classList.remove('open');
    pullup.classList.remove('open');
    document.body.style.overflow = '';
  }

</script>
